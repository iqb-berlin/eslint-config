name: Lint and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
        eslint-version: ['9', '10']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Select ESLint version
        run: npm install --no-save --package-lock=false eslint@${{ matrix.eslint-version }} @eslint/js@${{ matrix.eslint-version }}

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Test installed package in a consumer
        run: npm run test:package
        env:
          ESLINT_VERSION: ${{ matrix.eslint-version }}
