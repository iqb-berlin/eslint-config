name: Lint and Test

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x', '24.x']
        eslint-version: ['9', '10']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Select ESLint version
        run: npm install --no-save --package-lock=false eslint@${{ matrix.eslint-version }} @eslint/js@${{ matrix.eslint-version }}

      - name: Audit dependencies
        run: npm run audit

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Test installed package in a consumer
        run: npm run test:package
        env:
          ESLINT_VERSION: ${{ matrix.eslint-version }}
          APPLY_SECURITY_OVERRIDES: '1'

      - name: Install pnpm
        run: npm install --global pnpm@10.32.1

      - name: Test installed package without dependency hoisting
        run: npm run test:package
        env:
          ESLINT_VERSION: ${{ matrix.eslint-version }}
          PACKAGE_MANAGER: pnpm
          APPLY_SECURITY_OVERRIDES: '1'

  validation:
    name: Validation
    if: always()
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Require all supported combinations to pass
        env:
          MATRIX_RESULT: ${{ needs.lint-and-test.result }}
        run: test "$MATRIX_RESULT" = success
